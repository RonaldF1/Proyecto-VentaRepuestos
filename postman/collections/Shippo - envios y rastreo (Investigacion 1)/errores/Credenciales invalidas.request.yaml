$kind: http-request
url: "{{base_url}}/carrier_accounts"
method: GET
auth:
  type: apikey
  credentials:
    key: Authorization
    value: "{{auth_secret_0cn9}}"
    in: header
scripts:
  - type: afterResponse
    code: |-
      pm.test('Estado 401 con credenciales invalidas', function () { pm.response.to.have.status(401); });
      console.log('Cuerpo del error:', pm.response.text());
    language: text/javascript
order: 1000
